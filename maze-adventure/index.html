<!doctype html>
<html lang="zh-Hant-HK"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>越障探險隊｜指令卡迷宮</title>
<style>
*{box-sizing:border-box} [hidden]{display:none!important}
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0b1420;color:#f8fbff}
body{margin:0;min-height:100vh;background:linear-gradient(110deg,#07121ced,#07121c77),var(--scene,#152b3a);background-size:cover;background-position:center;background-attachment:fixed}
main{max-width:1120px;margin:auto;padding:20px} header,.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header{border-bottom:1px solid #ffffff42;padding-bottom:14px} h1{font-size:clamp(2rem,6vw,4rem);margin:.1em 0} h2{margin:0 0 12px} p{line-height:1.55}
small{font-size:.9rem;color:#d0e4ee}.accent{color:#96f9ce;font-weight:800}.layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
.panel{background:#0e1d2aeb;border:1px solid #bde9ff50;border-radius:22px;padding:clamp(12px,2vw,22px);box-shadow:0 16px 40px #0005}
#welcome{max-width:540px;margin:28px 0}.fields,.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}label{display:grid;gap:6px}
button,select{font:inherit;min-height:44px;border-radius:12px;padding:8px 12px;border:1px solid #75a29b;background:#1a3847;color:#fff}button{cursor:pointer;font-weight:700}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible{outline:3px solid #ffd97a;outline-offset:3px}.primary{background:#9cf2ca;color:#08251a;border-color:#9cf2ca}.fields button{align-self:end}
#board{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:3px;border:1px solid #d8f6fd65;border-radius:12px;padding:5px;background:#07141dc9}
.cell{display:grid;place-items:center;position:relative;min-width:0;aspect-ratio:1;background:color-mix(in srgb,var(--tile) 25%,#142837);border-radius:4px;font-size:clamp(.85rem,3.7vw,1.85rem)}
.cell:nth-child(even){background:color-mix(in srgb,var(--tile) 36%,#142837)}.cell.trail{box-shadow:inset 0 0 0 2px #91efbc}.cell.goal{background:#684f20}.cell.block{background:#3c2632;box-shadow:inset 0 0 0 1px #f2bb8a65}.cell.start{outline:1px dashed #c2e7ec;outline-offset:-2px}
.facing{position:absolute;bottom:0;right:0;background:#101e28;color:#baffdc;border-radius:5px;font:bold clamp(.65rem,2vw,1rem) system-ui;padding:0 2px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(4px,1vw,8px)}
.cards button{display:grid;justify-items:center;align-content:center;gap:4px;min-width:0;min-height:clamp(66px,9vw,92px);padding:7px 1px;border-radius:15px;color:#123125;background:var(--card-fill,#dce9ed);border:2px solid var(--card-edge,#afc8ce);box-shadow:0 4px 0 #07131a80;font-size:clamp(.8rem,2vw,1.05rem);line-height:1.2;white-space:nowrap}
.cards b{font-size:clamp(1.65rem,4.5vw,2.4rem);line-height:1}
.cards .card-F{--card-fill:#adeda2;--card-edge:#5bbb63}
.cards .card-B{--card-fill:#9edcff;--card-edge:#55a8dd}
.cards .card-L{--card-fill:#ffe45c;--card-edge:#dba810}
.cards .card-R{--card-fill:#ffab99;--card-edge:#e77b64}
.cards button:disabled{opacity:.8}
.cards button:not(:disabled):active{transform:translateY(2px);box-shadow:0 2px 0 #07131a80}
.program{min-height:62px;background:#09151f;border:1px dashed #7299a3;border-radius:12px;padding:8px;margin:10px 0;display:flex;flex-wrap:wrap;gap:5px;align-items:center}.program button{padding:4px 8px;min-height:38px}.program .active{background:#ffd97a;color:#15202a}
#feedback{min-height:3em;margin-bottom:0}.stats{display:flex;flex-wrap:wrap;gap:8px 18px;margin-bottom:12px}.stats strong{font-size:1.35rem}.legend{margin:10px 0 0} .scenes{color:#d5edff;margin-bottom:16px}
@media(max-width:720px){.layout{grid-template-columns:1fr}body{background-attachment:scroll}}

.brand{display:flex;align-items:center;gap:10px}.badge{display:grid;place-items:center;width:38px;height:38px;background:#ffdb86;color:#192f40;border-radius:11px;font-size:24px}
.scenes{padding:12px 16px;border-radius:14px;background:#102334e8;border:1px solid #ffffff42;border-left:5px solid var(--tile)}
.board-frame{padding:11px;background:repeating-linear-gradient(135deg,#ffffff0b 0 6px,transparent 6px 12px),#080f18;border-radius:16px;border:1px solid #ffffff32}
.cell.start:before{content:'起';position:absolute;top:0;left:2px;font-size:.7rem;color:#fff}
.pawn{position:relative;z-index:2;display:grid;place-items:center;width:90%;height:90%;border-radius:50%;background:#ffe7a3;border:2px solid #fff1c3;box-shadow:0 3px 6px #000b}
.facing{right:-5px;bottom:-3px}.palette-label{margin:14px 0 6px}
.card-F{background:#1e5347;border-color:#77d5aa}.card-B{background:#214d6b;border-color:#75b8e5}.card-L{background:#614b0c;border-color:#f7d350}.card-R{background:#6c3a32;border-color:#edaa99}
.program{max-height:178px;overflow:auto}.program button{position:relative;min-width:45px}.program small{font-size:.68rem;margin-right:3px}
.program .selected{outline:2px solid #a3ffe0}.program .error{background:#8f303a;color:white}.edits{margin:0 0 10px}
#turn-preview{display:flex;align-items:center;gap:8px;margin:12px 0;color:#c1e6f4}
#turn-arrow{padding:3px 9px;background:#264a5e;border-radius:10px;color:#ffdf91}.actions{margin-top:12px}
#feedback[data-kind=success]{color:#a0ffcf}#feedback[data-kind=error]{color:#ffd4bc}

.pawn{pointer-events:none;background:#ffe7a3e6}
.direction-sprite,.car{position:absolute;inset:8%;background-repeat:no-repeat;image-rendering:pixelated}
.pawn .direction-sprite{filter:drop-shadow(0 1px 1px #182b34aa)}
.car{transform:rotate(var(--rotation,0deg))}
.car-body{position:absolute;inset:6% 19%;border-radius:25% 25% 19% 19%;background:#ffa937;border:2px solid #774100;box-shadow:-4px 3px 0 -1px #253328,4px 3px 0 -1px #253328}
.car-body i{position:absolute;inset:25% 12% 43%;background:#ffe4a9;border:1px solid #9d6323;border-radius:25%}
.car-body b,.car-body em{position:absolute;top:4%;width:24%;height:15%;background:#fff1bc;border-radius:35%}
.car-body b{left:6%}.car-body em{right:6%}
.facing{z-index:1;display:grid;place-items:center;width:clamp(12px,2.1vw,21px);aspect-ratio:1;border-radius:50%;background:#142f28;box-shadow:0 0 0 1px #fff;line-height:1}
.pawn[data-facing="0"] .facing{top:-3px;bottom:auto;right:50%;transform:translateX(50%)}
.pawn[data-facing="1"] .facing{right:-3px;bottom:50%;transform:translateY(50%)}
.pawn[data-facing="2"] .facing{bottom:-3px;right:50%;transform:translateX(50%)}
.pawn[data-facing="3"] .facing{left:-3px;right:auto;bottom:50%;transform:translateY(50%)}
.character-trigger{display:inline-flex;align-items:center;gap:8px}.character-control{margin-top:12px;justify-content:flex-start}
#character-picker{width:min(510px,calc(100% - 24px));border-radius:20px;border:1px solid #acd9d4;background:#102637;color:#f8fbff;padding:16px}
#character-picker h2{margin:0}#character-picker::backdrop{background:#05101bdd}
#character-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
#character-options button{display:grid;justify-items:center;gap:6px;padding:6px 0;font-size:.9rem}
#character-options button[aria-pressed=true]{border:2px solid #9cf2ca;background:#255049}
.choice-icon,#turn-arrow{position:relative;width:48px;aspect-ratio:1;border-radius:9px;background:#ffe7a3}
.character-trigger .choice-icon{width:28px}
#turn-arrow{display:grid;place-items:center;padding:0}
@media(max-width:520px){.pawn[data-facing] .facing{font-size:.66rem}}
</style>
<main>
<header><strong class="brand"><span class="badge" aria-hidden="true">✦</span>ivan’s learning-explorer</strong><div class="row"><span id="identity"></span><button id="switch" hidden>切換學生</button></div></header>
<h1>越障探險隊</h1>
<section id="welcome" class="panel">
<h2>排指令卡，到達終點</h2>
<p>每回合有三個障礙物。用指令卡繞過障礙，以最少步數到達旗仔。</p>
<form id="entry" class="fields"><label>班別<select id="class" required><option value="">選擇班別</option><option>2A</option><option>2B</option></select></label><label>學號<select id="number" required><option value="">選擇學號</option></select></label><button class="primary">開始探險</button></form>
<div class="row character-control"><button id="welcome-character" type="button" class="character-trigger">選擇角色</button></div>
</section>
<section id="game" hidden>
<div class="row scenes"><strong id="scene"></strong><span id="dimensions"></span><small id="sync-status" role="status"></small><button id="retry-sync" type="button" hidden>重試同步</button></div>
<div class="layout">
<section class="panel" aria-label="迷宮地圖"><div class="stats"><div>最少步數<br><strong id="target"></strong></div><div>已排指令<br><strong id="count"></strong></div><div>已執行<br><strong id="executed"></strong></div></div><div class="board-frame"><div id="board" role="img"></div></div><div class="row character-control"><span class="accent" id="facing-label"></span><button id="game-character" type="button" class="character-trigger">換角色</button></div><p class="legend"><small id="legend"></small></p></section>
<section class="panel"><h2>排好你的指令卡</h2><small>前進和後退各移動一格，左右轉向時留在原格。每張卡算一步。</small><h3 class="palette-label">指令卡</h3><div id="palette" class="cards"></div><h3 class="palette-label">指令順序</h3>
<div id="program" class="program" aria-label="指令列，按卡選取"></div>
<div id="edits" class="actions edits" hidden><button id="insert" aria-pressed="false">在前面插入</button><button id="remove">刪除這張</button></div>
<div id="turn-preview" hidden><strong id="turn-arrow"></strong><small id="turn-text"></small></div>
<div class="actions"><button id="run" class="primary">執行全部</button><button id="step">逐步執行</button><button id="rewind">回到起點</button><button id="clear">清空指令</button><button id="next" class="primary" hidden>下一回合</button></div>
<p id="feedback" role="status" aria-live="polite"></p><p id="first-hint" hidden><small>第一關提示：起點和終點在同一直線。試試轉向，從旁邊繞過障礙。</small></p></section>
</div>
</section>
</main>
<dialog id="character-picker" aria-labelledby="character-title">
<form method="dialog" class="row"><h2 id="character-title">選擇迷宮角色</h2><button>關閉</button></form>
<div id="character-options"></div>
</dialog>
<template id="car-template"><span class="car" aria-hidden="true"><span class="car-body"><i></i><b></b><em></em></span></span></template>

const cards={F:['↑','前進一步'],B:['↓','後退一步'],L:['↶','左轉'],R:['↷','右轉']};
const vectors=[[0,-1],[1,0],[0,1],[-1,0]];
const arrows=['↑','→','↓','←'];
const directions=['上','右','下','左'];
const key=({x,y})=>x+','+y;
const same=(a,b)=>a.x===b.x&&a.y===b.y;
function move(map,p,card){
 if(card==='L'||card==='R')return {...p,d:(p.d+(card==='L'?3:1))%4};
 const [dx,dy]=vectors[p.d];
 if(card!=='F'&&card!=='B')return null;
 const distance=card==='B'?-1:1;
 const q={x:p.x+dx*distance,y:p.y+dy*distance,d:p.d};
 return q.x>=0&&q.x<map.w&&q.y>=0&&q.y<map.h&&!map.blocks.has(key(q))?q:null;
}
function shortest(map){
 const queue=[[map.start,[]]], seen=new Set([key(map.start)+','+map.start.d]);
 const choices=Object.keys(cards);
 for(let i=0;i<queue.length;i++){
  const [p,route]=queue[i];
  if(same(p,map.exit))return route;
  for(const card of choices){
   const q=move(map,p,card);
   if(!q)continue;
   const id=key(q)+','+q.d;
   if(seen.has(id))continue;
   seen.add(id);queue.push([q,[...route,card]]);
  }
 }
 return null;
}
function makeMap(round,seed){
 let n=seed>>>0;
 const pick=max=>{n=(Math.imul(n,1664525)+1013904223)>>>0;return Math.floor(n/4294967296*max)};
 const [w,h]=sizes[round];
 const horizontal=pick(2)===0, reverse=pick(2)===0, extent=horizontal?w:h;
 const lane=pick(horizontal?h:w);
 const point=(along,cross=lane)=>{const a=reverse?extent-1-along:along;return horizontal?{x:a,y:cross}:{x:cross,y:a}};
 const start={...point(0),d:horizontal?(reverse?3:1):(reverse?0:2)};
 const exit=point(extent-1);
 const first=1+pick(extent-2),blocks=new Set([key(point(first))]);
 if(round>=4){
  const candidates=Array.from({length:extent-2},(_,i)=>i+1).filter(i=>Math.abs(i-first)>1);
  blocks.add(key(point(candidates[pick(candidates.length)])));
 }
 const otherCells=Array.from({length:w*h},(_,i)=>({x:i%w,y:Math.floor(i/w)})).filter(p=>horizontal?p.y!==lane:p.x!==lane);
 while(blocks.size<3) blocks.add(key(otherCells.splice(pick(otherCells.length),1)[0]));
 return {w,h,start,exit,blocks};
}
function buildRound(round,seed){
 for(let i=0;i<20;i++){
  const map=makeMap(round,(seed+Math.imul(i,2654435761))>>>0);
  if(round>=2){
   const edge=map.exit;
   const sameRow=edge.y===map.start.y;
   const corner=sameRow
    ?{x:edge.x,y:edge.y<map.h/2?map.h-1:0}
    :{x:edge.x<map.w/2?map.w-1:0,y:edge.y};
   if(!map.blocks.has(key(corner)))map.exit=corner;
  }
  const route=shortest(map);
  if(route)return {...map,target:route.length};
 }
 const [w,h]=sizes[round],column=Math.floor(w/2);
 const map={
  w,h,start:{x:0,y:2,d:1},exit:{x:w-1,y:2},
  blocks:new Set([column+',1',column+',2',column+',3']),
 };
 return {...map,target:shortest(map).length};
}
for(let n=1;n<=25;n++)$('number').add(new Option(n+' 號',n));
let profile,progress,map,program=[],position,trail,playing=false,won=false,version=0;
let active=-1,selected=-1,inserting=false,ended=false,hit=false;
let character=characters[0];
let renderedPreview='';

function characterArt(item,direction){
 if(!item.id){
  const car=$('car-template').content.firstElementChild.cloneNode(true);
  car.style.setProperty('--rotation',direction*90+'deg');
  return car;
 }
 const sprite=directionSprite(item.id,direction),icon=document.createElement('span');
 icon.className='direction-sprite';
 icon.style.backgroundImage='url("'+spriteUrl(sprite)+'")';
 icon.style.backgroundSize=sprite.size;
 icon.style.backgroundPosition=sprite.position;
 icon.setAttribute('aria-hidden','true');
 return icon;
}
function characterBadge(item){
 const badge=document.createElement('span');
 badge.className='choice-icon';badge.append(characterArt(item,2));
 return badge;
}
function updateCharacterButtons(){
 $('welcome-character').replaceChildren(characterBadge(character),'選擇角色 · '+character.name);
 $('game-character').replaceChildren(characterBadge(character),'換角色');
}
function selectCharacter(item){
 character=item;updateCharacterButtons();
 if(map){scene();draw();render();}
}
function openCharacterPicker(){
 const picker=$('character-picker');
 $('character-options').replaceChildren(...characters.map(item=>{
  const button=makeButton(item.name,()=>{selectCharacter(item);picker.close();});
  button.setAttribute('aria-pressed',String(item===character));
  button.prepend(characterBadge(item));
  return button;
 }));
 picker.showModal();
}

const saveKey=()=> 'maze-adventure-v1:'+profile;
const progressApi='https://nltqzuhubqhwtfxwuupr.supabase.co/rest/v1/maze_adventure_grade2_rounds';
const publishableKey='sb_publishable_lnFCcbPSjbJg_z6QG-KZUw__n6rnwll';
const outboxPrefix='maze-adventure-grade2:pending:';
const pendingInMemory=new Map();
let syncing=false,student;

function pendingProgress(){
 const records=new Map(pendingInMemory);
 try{
  for(const name of Object.keys(localStorage)){
   if(!name.startsWith(outboxPrefix))continue;
   const record=JSON.parse(localStorage.getItem(name));
   if(record?.event_id)records.set(record.event_id,record);
  }
 }catch{}
 return [...records.values()];
}
function syncStatus(text,retry=false){
 $('sync-status').textContent=text;
 $('retry-sync').hidden=!retry;
}
function queueCompletion(steps){
 const record={
  event_id:crypto.randomUUID(),
  class_code:student.classCode,
  student_number:student.number,
  round_number:progress.round+1,
  map_seed:progress.seed,
  steps,
 };
 pendingInMemory.set(record.event_id,record);
 try{localStorage.setItem(outboxPrefix+record.event_id,JSON.stringify(record));}catch{}
 syncStatus('正在同步學習紀錄…');
 void flushProgress();
}
async function flushProgress(){
 if(syncing||!student)return;
 syncing=true;
 try{
  for(let records=pendingProgress();records.length;records=pendingProgress()){
   const record=records[0];
   const response=await fetch(progressApi,{
    method:'POST',
    headers:{apikey:publishableKey,'Content-Type':'application/json',Prefer:'return=minimal'},
    body:JSON.stringify(record),
    signal:AbortSignal.timeout(12000),
   });
   if(!response.ok){
    const error=response.status===409?await response.json():null;
    if(error?.code!=='23505')throw new Error('未能同步');
   }
   pendingInMemory.delete(record.event_id);
   try{localStorage.removeItem(outboxPrefix+record.event_id);}catch{}
   if(student?.classCode===record.class_code&&student.number===record.student_number){
    syncStatus('第 '+record.round_number+' 回合已同步');
   }
  }
 }catch{
  if(student)syncStatus('有紀錄待同步',true);
 }finally{syncing=false;}
}
$('retry-sync').onclick=()=>{syncStatus('正在同步學習紀錄…');void flushProgress();};
window.addEventListener('online',()=>{void flushProgress();});
const seed=()=>crypto.getRandomValues(new Uint32Array(1))[0];
function save(){
 try{localStorage.setItem(saveKey(),JSON.stringify(progress));return true;}
 catch{return false;}
}
function restore(){
 try{
  const saved=JSON.parse(localStorage.getItem(saveKey()));
  if(saved&&Number.isInteger(saved.round)&&sizes[saved.round]&&Number.isInteger(saved.seed)&&typeof saved.won==='boolean')return saved;
 }catch{}
 return {round:0,seed:seed(),won:false};
}
function scene(){
 const i=progress.round%scenes.length;
 const [title,icon,obstacle,color,background]=scenes[i];
 document.body.style.setProperty('--scene','url('+artworks[i]+'),'+background);
 document.body.style.setProperty('--tile',color);
 $('scene').textContent='第 '+(progress.round+1)+' / '+sizes.length+' 回合 · '+icon+' '+title;
 $('dimensions').textContent=map.w+' 欄 × '+map.h+' 行';
 $('legend').textContent=character.name+'　🏁 終點　'+icon+' '+obstacle+' × 3';
 $('target').textContent=map.target+' 步';
 $('first-hint').hidden=progress.round!==0;
 return icon;
}
function message(s,kind=''){$('feedback').textContent=s;$('feedback').dataset.kind=kind;}
function draw(previous,card){
 const board=$('board'),icon=scenes[progress.round%scenes.length][1];
 board.style.setProperty('--cols',map.w);
 $('facing-label').textContent=arrows[position.d]+' '+character.name+'朝'+directions[position.d]+'方';
 const location=p=>'第 '+(p.y+1)+' 行第 '+(p.x+1)+' 欄';
 const blocks=[...map.blocks].map(s=>{const [x,y]=s.split(',').map(Number);return location({x,y});});
 board.setAttribute('aria-label',character.name+'在'+location(position)+'，朝向'+['上','右','下','左'][position.d]+'。終點在'+location(map.exit)+'。障礙在'+blocks.join('、')+'。');
 const cells=Array.from({length:map.w*map.h},(_,i)=>{
  const p={x:i%map.w,y:Math.floor(i/map.w)},el=document.createElement('div');
  el.className='cell';
  if(same(p,map.start))el.classList.add('start');
  if(trail.has(key(p)))el.classList.add('trail');
  if(same(p,map.exit)){el.classList.add('goal');el.textContent='🏁';}
  if(map.blocks.has(key(p))){el.classList.add('block');el.textContent=icon;}
  if(same(p,position)){
   const pawn=document.createElement('span');
   pawn.className='pawn';pawn.dataset.facing=position.d;
   pawn.append(characterArt(character,position.d));
   const facing=document.createElement('span');
   facing.className='facing';facing.textContent=arrows[position.d];
   pawn.append(facing);el.replaceChildren(pawn);
  }
  return el;
 });
 board.replaceChildren(...cells);
 if(!previous||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const pawn=board.querySelector('.pawn');
 const before=cells[previous.y*map.w+previous.x].getBoundingClientRect();
 const after=cells[position.y*map.w+position.x].getBoundingClientRect();
 const x=before.left-after.left,y=before.top-after.top;
 let frames=[{transform:'translate('+x+'px,'+y+'px)'},{transform:'translate(0,0)'}];
 if(hit)frames=[{transform:'translateX(0)'},{transform:'translateX(5px)'},{transform:'translateX(-5px)'},{transform:'translateX(0)'}];
 else if(card==='L'||card==='R'){
  if(character.id)return;
  const from=(position.d*90+(card==='L'?90:-90))+'deg',to=position.d*90+'deg';
  pawn.querySelector('.car').animate([{transform:'rotate('+from+')'},{transform:'rotate('+to+')'}],{duration:270,easing:'ease-out'});
  return;
 }
 pawn.animate(frames,{duration:270,easing:'ease-out'});
}
const makeButton=(text,action)=>{
 const btn=document.createElement('button');
 btn.type='button';btn.textContent=text;btn.onclick=action;return btn;
};
const limit=()=>map.w*map.h*2;
for(const [code,[symbol,name]] of Object.entries(cards)){
 const btn=makeButton(name,()=>{
  if(program.length>=limit())return;
  program.splice(inserting?selected:program.length,0,code);resetEditor();
 });
 const icon=document.createElement('b');
 btn.classList.add('card-'+code);
 icon.textContent=symbol;icon.setAttribute('aria-hidden','true');btn.prepend(icon);$('palette').append(btn);
}
function render(){
 $('count').textContent=program.length+' 張';
 const executed=won?progress.steps:active+1-(hit?1:0);
 $('executed').textContent=executed==null?'—':executed+' 步';
 const sequence=$('program'), previousScroll=sequence.scrollTop;
 sequence.replaceChildren(...program.map((code,i)=>{
  const [symbol,name]=cards[code];
  const btn=makeButton(symbol,()=>{
   selected=selected===i?-1:i;inserting=false;render();
   sequence.children[i]?.focus({preventScroll:true});
  });
  const number=document.createElement('small');
  number.textContent=i+1;btn.prepend(number);
  btn.classList.add('card-'+code);
  btn.setAttribute('aria-label','第 '+(i+1)+' 張，'+name);
  btn.setAttribute('aria-pressed',String(selected===i));
  btn.disabled=playing||won;
  if(i===active)btn.classList.add(hit?'error':'active');
  if(i===selected)btn.classList.add('selected');
  return btn;
 }));
 sequence.scrollTop=previousScroll;
 if(active>=0){
  const current=sequence.children[active];
  if(current&&current.getBoundingClientRect().bottom>sequence.getBoundingClientRect().bottom){
   sequence.scrollTop+=current.getBoundingClientRect().bottom-sequence.getBoundingClientRect().bottom;
  }
 }
 if(!program.length)sequence.textContent='點選上方的指令卡，依次排入這裏。';
 for(const btn of $('palette').children)btn.disabled=playing||won||program.length>=limit();
 $('run').disabled=playing||won||!program.length;
 $('step').disabled=$('run').disabled;
 $('game-character').disabled=playing;
 $('rewind').disabled=playing||won||active<0;
 $('clear').disabled=playing||won||!program.length;
 $('next').hidden=!won;
 $('next').textContent=progress.round===sizes.length-1?'重新探險':'下一回合';
 $('edits').hidden=selected<0||playing||won;
 $('insert').setAttribute('aria-pressed',String(inserting));
 let facing=map.start.d,last=-1;
 for(const [i,card] of program.entries()){
  if(card==='L'||card==='R'){facing=(facing+(card==='L'?3:1))%4;last=i;}
 }
 $('turn-preview').hidden=last<0;
 if(last>=0){
  const previewKey=character.id+','+facing;
  if(renderedPreview!==previewKey){
   $('turn-arrow').replaceChildren(characterArt(character,facing));
   renderedPreview=previewKey;
  }
  $('turn-text').textContent='轉向預覽 · 第 '+(last+1)+' 張卡後，'+character.name+'朝'+directions[facing]+'方 '+arrows[facing];
 }
}
function resetPosition(){
 position=map.start;trail=new Set([key(position)]);
 active=-1;ended=false;hit=false;
}
function resetEditor(){
 selected=-1;inserting=false;resetPosition();draw();render();
 message('排好指令後，按「執行全部」或「逐步執行」。');
}
function loadRound(){
 map=buildRound(progress.round,progress.seed);program=[];selected=-1;inserting=false;playing=false;won=progress.won;
 resetPosition();
 if(won)position=shortest(map).reduce((p,card)=>move(map,p,card),map.start);
 scene();draw();render();
 message(won?(progress.round===sizes.length-1?'十個回合全部完成！':'本回合已過關。'):'找出可以跨過障礙的最短路線。');
}
$('entry').onsubmit=event=>{
 event.preventDefault();
 const c=$('class').value,n=Number($('number').value);
 if(!['2A','2B'].includes(c)||!Number.isInteger(n)||n<1||n>25)return;
 student={classCode:c,number:n};
 profile=c+' · '+n+' 號';progress=restore();save();
 syncStatus('完成回合後會同步進度');
 void flushProgress();
 $('identity').textContent=profile;$('switch').hidden=false;$('welcome').hidden=true;$('game').hidden=false;
 loadRound();
};
$('switch').onclick=()=>{
 version++;student=null;$('game').hidden=true;$('welcome').hidden=false;$('identity').textContent='';$('switch').hidden=true;$('entry').reset();
};
$('clear').onclick=()=>{program=[];resetEditor();message('指令已清空。');};
$('rewind').onclick=resetEditor;
$('remove').onclick=()=>{program.splice(selected,1);resetEditor();};
$('insert').onclick=()=>{
 inserting=!inserting;render();
 message(inserting?'點選一張指令卡，插入第 '+(selected+1)+' 張卡之前。':'已取消插入。');
};
$('next').onclick=()=>{
 progress={round:(progress.round+1)%sizes.length,seed:seed(),won:false};save();loadRound();
};
function advance(){
 const card=program[++active],previous=position,next=move(map,position,card);
 if(!next){
  hit=true;ended=true;
  message('第 '+(active+1)+' 張卡遇到阻礙。'+'檢查'+character.name+'的朝向，試試轉向繞過障礙。','error');
 }else{
  position=next;trail.add(key(next));
  if(same(position,map.exit)){
   ended=true;
   const steps=active+1;
   won=steps===map.target;
   if(won){
    progress.won=true;
    progress.steps=steps;
    const stored=save();
    queueCompletion(steps);
    message((progress.round===sizes.length-1?'十個回合全部完成！':'成功！你用 '+map.target+' 步到達終點。')+(stored?'':'　此裝置未能儲存進度。'),'success');
   }else{
    const extra=steps-map.target;
    message('已到達終點！今次執行了 '+steps+' 步，比最短路線多 '+extra+' 步。目標是 '+map.target+' 步。','error');
   }
  }else if(active+1===program.length){
   ended=true;message('指令用完了，'+character.name+'還未到終點。再排幾張卡試試！','error');
  }else{
   message('已執行第 '+(active+1)+' 張「'+cards[card][1]+'」卡。'+character.name+'朝'+directions[position.d]+'方。');
  }
 }
 draw(previous,card);render();
}
async function execute(all){
 const run=++version;
 if(all||ended)resetPosition();
 selected=-1;inserting=false;playing=true;draw();
 do {
  advance();
  await new Promise(resolve=>setTimeout(resolve,300));
  if(run!==version)return;
 }while(all&&!ended);
 playing=false;render();
}
$('run').onclick=()=>execute(true);
$('step').onclick=()=>execute(false);
$('welcome-character').onclick=openCharacterPicker;
$('game-character').onclick=openCharacterPicker;
updateCharacterButtons();
</script>
