<!doctype html><html lang="zh-Hant-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#315b47"><meta name="description" content="香港小四科學・觀察親代與子代的相似特徵，六關互動遊戲。"><title>特徵小偵探｜小四科學探索</title><link rel="stylesheet" href="./style.css"></head><body><header><a class="brand" href="./"><span class="brand-icon">⌕</span><span>特徵小偵探<small>THE LITTLE TRAIT DETECTIVES</small></span></a><nav><button class="nav-btn" id="home">探索地圖</button><button class="nav-btn" id="curriculum">學習重點</button><button class="teacher-link" id="teacher">教師平台 ↗</button></nav></header><main id="app" tabindex="-1"></main><footer><span>觀察・比較・發現生命的小秘密</span><span>香港小四科學 · 2025 課程指引</span></footer><dialog id="info"><form method="dialog"><button class="close" aria-label="關閉">×</button></form><h2>這次會學甚麼？</h2><p>親代是產生後代的上一代；子代就是後代。</p><p>動物和植物的子代，具有與親代相似的特徵。有些特徵可從親代繼承；頭髮長度等特徵則可在後天改變。</p><p>遊戲的配對以虛構的種植、照顧及家庭紀錄為依據。相似外貌不能用來確定現實中的親子關係。</p><p>對應教育局《科學（小一至小六）課程指引》（2025），第 27 頁：4LC4、4LC5、4LC6。葉形用作 4LC4 觀察親代與子代相似特徵的活動。</p><a href="https://www.edb.gov.hk/attachment/tc/curriculum-development/kla/science-edu/pri-sci/PSCG%282025%29.pdf" target="_blank" rel="noopener">查看教育局課程指引 ↗</a></dialog><script type="module" src="./app.js"></script></body></html>
