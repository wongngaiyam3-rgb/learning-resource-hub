<!doctype html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://nltqzuhubqhwtfxwuupr.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>教師平台｜反射實驗室</title>
  <link rel="icon" href="../icon.svg">
  <link rel="stylesheet" href="../style.css">
  <script type="module" src="./teacher.js"></script>
</head>
<body>
  <header class="topbar"><div class="topinner">
    <a class="brand" href="../"><span class="brand-mark" aria-hidden="true">✦</span>反射實驗室</a>
    <button class="button secondary" id="logout" type="button" hidden>登出</button>
  </div></header>
  <main class="shell">
    <section class="heading"><div class="heading-text">
      <p class="eyebrow"><span></span>小四科學 · 光的反射</p>
      <h1>教師<span>平台</span></h1>
      <p>按班別或學號查看已同步的闖關成績。</p>
    </div></section>
    <section class="side-card" id="login">
      <h2>教師登入</h2>
      <form id="login-form">
        <div class="fields"><label>登入碼<input type="password" id="password" autocomplete="current-password" required maxlength="128"></label></div>
        <button class="button primary" id="login-button" type="submit">登入</button>
      </form>
    </section>
    <section class="side-card" id="dashboard" hidden>
      <div class="game-head"><h2>學生進度</h2><p class="card-label" id="school-year"></p></div>
      <div class="fields">
        <label>班別<select id="group"><option value="">全級</option><option>4A</option><option>4B</option><option>4C</option></select></label>
        <label>學號<select id="number"><option value="">全部</option></select></label>
      </div>
      <p class="muted">每關顯示最佳得分及當次鏡子數目。班別和學號由學生自行選擇。</p>
      <div class="teacher-table"><table>
        <thead><tr><th scope="col">學生</th><th scope="col">完成</th><th scope="col">總分</th><th scope="col">各關成績</th></tr></thead>
        <tbody id="records"></tbody>
      </table></div>
    </section>
    <p id="status" class="feedback" role="status"></p>
  </main>
</body>
</html>
