nd:#eff5f1}.readout{font:700 28px monospace;border-bottom:2px solid #64857d;min-height:36px;margin:8px 0 16px}.meta{display:flex;justify-content:space-between;align-items:center}.bar{height:8px;border-radius:10px;background:#d4e4db;margin:14px 0 20px}.bar i{display:block;height:100%;background:#349d7a;border-radius:10px}.msg{color:#923b1c;min-height:20px;font-size:15px}.wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}td,th{text-align:left;padding:11px 9px;border-bottom:1px solid #dce7e2}th{color:#436860}.actions{flex-wrap:wrap;align-items:center;margin:14px 0}.actions select{width:auto}.empty{padding:34px;text-align:center;color:#55726e}button:disabled{opacity:.6}.titlebar{margin-bottom:20px}@media(max-width:750px){.intro,.lab{grid-template-columns:1fr}.hero{min-height:210px}.art{position:absolute;right:-65px;bottom:-17px;transform:scale(.6)}.hero p{max-width:66%}header{height:auto;min-height:60px;padding:8px 12px}header b{font-size:16px}header button{padding:6px}.brand{margin-right:4px}main{padding:18px 12px}}@media(min-width:751px) and (max-height:760px){main{padding-top:20px}.card{padding:20px}.hero{min-height:350px}.sheet{grid-auto-rows:31px;line-height:31px}}
</style><header><b><span class="brand">÷</span>除法直式實驗室</b><nav><button id="home">學生入口</button><button id="rank">排行榜</button><button id="teacher">教師管理</button></nav></header><main id="app"></main><script>
const bank=[[[48,2],[69,3],[84,4],[55,5],[96,3],[52,4],[72,6],[91,7],[65,4],[87,5],[73,6],[98,8],[60,3],[80,4],[90,3],[61,3],[82,4],[37,6],[95,9],[99,5]],[[246,2],[369,3],[488,4],[555,5],[648,3],[735,5],[432,6],[924,7],[347,4],[578,6],[853,7],[999,8],[408,4],[615,3],[840,4],[804,8],[607,3],[823,4],[705,7],[902,9]]],api="https://eoweuhjuazcjjztnugoi.supabase.co/rest/v1/rpc/p3div_",key="sb_publishable_J-QQNbSeUsya0w7-PK1GWA_TdSDpJ7k";
const $=id=>document.getElementById(id),app=$('app'),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mode=2,r=null,entry='',request=null,page=0,profile={},busy=false,pass='',records=[];
function screen(){page++;busy=false;pass='';records=[];app.onkeydown=null;return page}
async function rpc(name,data){let res=await fetch(api+name,{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify(data)});if(!res.ok){let e=await res.json();throw Error(e.message==='密碼不正確'?e.message:e.code==='P0002'?'姓名與這個班別及學號的紀錄不符。':'連線未成功，請重試。')}return res.json()}
const time=s=>Math.floor(s/60)+' 分 '+String(Math.floor(s%60)).padStart(2,'0')+' 秒';
function opts(list,selected){return list.map(v=>'<option '+(v==selected?'selected':'')+'>'+v+'</option>').join('')}
function home(){screen();app.innerHTML='<div class="intro"><section class="hero"><small>小三數學　／　除法</small><h1>除法直式<br>實驗室</h1><p>由最高位開始，逐步寫商、乘、減。</p><div class="art" aria-hidden="true"><div class="robot"><div class="face">•ᴗ•</div><div class="switch">● ▬</div></div><div class="flask">÷</div><div class="bubble">○ °</div></div></section><form class="card" id="login"><h2>學生登入</h2><div class="pair"><label>班別<select required id="cls"><option value="">選擇班別</option>'+opts(['3A','3B','3C'],profile.c)+'</select></label><label>學號<select required id="num"><option value="">選擇學號</option>'+opts(Array.from({length:25},(_,i)=>i+1),profile.s)+'</select></label></div><label>姓名<input id="name" required maxlength="30" autocomplete="off" placeholder="輸入中文或英文姓名" value="'+esc(profile.n)+'"></label><b>選擇闖關模式</b><div class="modes" style="margin-top:8px">'+[2,3].map(m=>'<button type="button" data-mode="'+m+'">'+(m===2?'兩':'三')+'位數 ÷ 一位數<small>20 個關卡</small></button>').join('')+'</div><button class="go">開始或繼續闖關</button><p class="note">由首次開始計至完成第 20 關，中途離開亦會計時。</p><div class="msg" role="status" id="msg"></div></form></div>';function pick(){document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('selected',+b.dataset.mode===mode);b.setAttribute('aria-pressed',+b.dataset.mode===mode);b.onclick=()=>{mode=+b.dataset.mode;pick()}})}pick();$('login').onsubmit=async e=>{e.preventDefault();if(busy)return;let p=page;busy=true;profile={c:$('cls').value,s:+$('num').value,n:$('name').value.trim()};try{let run=await rpc('start',{c1:profile.c,s1:profile.s,n1:profile.n,m1:mode});if(page===p){r=run;mode=r.m;entry='';request=null;game()}}catch(e){if(page===p)$('msg').textContent=e.message}finally{if(page===p)busy=false}}}
function layout(n,d){let steps=[],rem=0;[...String(n)].forEach((dig,i)=>{let x=rem*10+Number(dig),q=Math.floor(x/d);rem=x%d;if(!steps.length&&x<d)return;steps.push({i,x,q,prod:q*d,rem})});return steps}
function game(message=''){screen();if(r.done===20){app.innerHTML='<section class="card"><span class="cap">20 / 20</span><h1>闖關成功！</h1><p>你已完成這個模式的所有關卡。</p><button id="see">查看闖關時間排行榜</button></section>';$('see').onclick=()=>ranking(mode);return}
let [n,d]=bank[mode-2][r.done],digits=String(n),steps=layout(n,d),idx=r.step-1,current=steps[Math.floor(idx/3)],kind=idx%3,html='';
function cell(col,row,txt,cls='',span=1){html+='<span class="cell '+cls+'" style="grid-column:'+col+' / span '+span+';grid-row:'+row+'">'+txt+'</span>'}
cell(1,2,d);[...digits].forEach((v,i)=>cell(i+2,2,v,'top '+(i===0?'left':'')));
function write(value,end,row,k,extra=''){let len=String(value).length;if(k>idx)return;cell(end+1-len,row,k===idx?(entry||'□'):value,(k===idx?'active ':'')+extra,len)}
steps.forEach((s,j)=>{let col=s.i+2,row=3+j*2;write(s.q,col,1,3*j);if(idx>=3*j+1)cell(1,row,'−');write(s.prod,col,row,3*j+1,'under');write(s.rem,col,row+1,3*j+2);if(j+1<steps.length && idx>=3*j+3)cell(col+1,row+1,digits[s.i+1])});
let place=['個','十','百'][digits.length-current.i-1],prompt=[place+'位的商是多少？','把剛寫的商乘以 '+d+'，積是多少？',current.x+' 減 '+current.prod+'，餘下多少？'][kind];
app.innerHTML='<div class="meta"><b>'+esc(r.c)+' 班 '+r.s+' 號　'+esc(r.n)+'</b><span>'+mode+' 位數 ÷ 一位數</span></div><div class="bar"><i style="width:'+r.done*5+'%"></i></div><div class="lab"><section class="card"><span class="cap">第 '+(r.done+1)+' / 20 關</span><h1>'+n+' ÷ '+d+'</h1><div class="board"><div class="sheet" style="grid-template-columns:repeat('+(digits.length+1)+',44px)">'+html+'</div></div></section><section class="card"><span class="cap">'+['寫商','做乘法','做減法'][kind]+'</span><h2>'+prompt+'</h2><div class="readout" id="out">'+(entry||'＿')+'</div><div class="keys">'+[1,2,3,4,5,6,7,8,9,'清除',0,'退格'].map(v=>'<button data-key="'+v+'">'+v+'</button>').join('')+'</div><button class="go" id="submit">核對答案</button><div role="status" class="msg" id="msg">'+esc(message)+'</div></section></div>';
function digit(k){if(busy)return;entry=k==='清除'?'':k==='退格'?entry.slice(0,-1):(entry+k).slice(0,2);request=null;$('out').textContent=entry||'＿';document.querySelector('.active').textContent=entry||'□'}
document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>digit(b.dataset.key));$('submit').onclick=async()=>{if(busy||!entry)return;busy=true;let p=page;request??=crypto.randomUUID();try{let a=await rpc('answer',{t:r.token,l:r.done+1,k:r.step,v:+entry,req:request});if(p!==page)return;let previous=r.done;r.done=a.done;r.step=a.step;entry='';request=null;game(a.ok?(previous!==r.done?'上一關完成！':'答對了！'):(kind===0?'再試一次。這一位不夠除時，記得寫 0。':kind===1?'再試一次，核對乘法口訣。':'再試一次，餘數要比除數小。'))}catch(e){if(page===p){busy=false;$('msg').textContent='未能確認儲存，請再按「核對答案」。'}}};app.onkeydown=e=>{if(/^\d$/.test(e.key))digit(e.key);else if(e.key==='Backspace'){e.preventDefault();digit('退格')}}}
const table=(heads,rows)=>'<div class="wrap"><table><thead><tr>'+heads.map(s=>'<th>'+s+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(s=>'<td>'+esc(s)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
async function ranking(m){let p=screen();app.innerHTML='<section class="card"><span class="cap">完成全部 20 關</span><h1>闖關時間排行榜</h1><div class="modes">'+[2,3].map(i=>'<button id="r'+i+'" class="'+(i===m?'selected':'')+'">'+(i===2?'兩':'三')+'位數 ÷ 一位數</button>').join('')+'</div><p class="note">按完成時間排列，顯示最快的 10 名學生。</p><div id="results">讀取中…</div></section>';[2,3].forEach(i=>$('r'+i).onclick=()=>ranking(i));try{let rows=await rpc('rank',{m1:m});if(page===p)$('results').innerHTML=table(['名次','班別','學號','姓名','闖關時間'],rows.map((v,i)=>[i+1,v.c,v.s,v.n,time(v.sec)]))+(rows.length?'':'<p class="empty">暫時未有學生完成這個模式的全部關卡。</p>')}catch(e){if(page===p)$('results').textContent='未能讀取，請再選一次模式。'}}
function teacher(){let p=screen();app.innerHTML='<form id="auth" class="card" style="max-width:480px;margin:auto"><h2>教師管理</h2><label>教師密碼<input required type="password" id="pw" autocomplete="current-password"></label><button class="go">登入</button><div class="msg" id="msg"></div></form>';$('auth').onsubmit=async e=>{e.preventDefault();let pw=$('pw').value;try{let rows=await rpc('teacher',{p:pw});if(page===p){pass=pw;records=rows;dashboard()}}catch(e){if(page===p)$('msg').textContent=e.message}}}
function dashboard(){app.innerHTML='<section class="card"><h2>學生闖關紀錄</h2><div class="actions"><select aria-label="班別" id="filter">'+opts(['3A','3B','3C'])+'</select><select aria-label="模式" id="mod"><option value="2">兩位數 ÷ 一位數</option><option value="3">三位數 ÷ 一位數</option></select><button id="refresh">更新紀錄</button><button id="csv">匯出 CSV</button><button id="logout">登出</button></div><p class="note">錯誤次數按步驟分類。錯題欄顯示曾經答錯的關卡。</p><div id="results"></div></section>';let heads=['班別','學號','姓名','完成關卡','寫商錯誤','乘法錯誤','減法錯誤','錯題關卡','完成時間'];function rows(){return Array.from({length:25},(_,i)=>{let c=$('filter').value,m=+$('mod').value,v=records.find(x=>x.c===c&&x.s===i+1&&x.m===m),cnt=[0,0,0],levels=new Set;for(let key of Object.keys(v?.errors||{})){let [l,k]=key.split('-');levels.add(+l);cnt[(k-1)%3]++}return [c,i+1,v?.n||records.find(x=>x.c===c&&x.s===i+1)?.n||'—',(v?.done||0)+'/20',...cnt,[...levels].sort((a,b)=>a-b).join('、')||'—',v?.finished?time(Math.round((Date.parse(v.finished)-Date.parse(v.started))/1000)):'—']})}function show(){$('results').innerHTML=table(heads,rows())}show();$('filter').onchange=$('mod').onchange=show;$('logout').onclick=teacher;$('refresh').onclick=async()=>{let p=page;try{let z=await rpc('teacher',{p:pass});if(p===page){records=z;show()}}catch(e){if(p===page)$('results').textContent=e.message}};$('csv').onclick=()=>{let csv=[heads,...rows()].map(row=>row.map(v=>'"'+String(v).replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));a.download=$('filter').value+'_'+$('mod').value+'位數除法.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}}
$('home').onclick=home;$('rank').onclick=()=>ranking(mode);$('teacher').onclick=teacher;home();
</script></html>
